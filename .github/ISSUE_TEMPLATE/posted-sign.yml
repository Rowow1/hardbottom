name: Posted sign
description: Share a photo of a sign about fishing, spearfishing, diving or swimming.
labels: ["signage"]
body:
  - type: markdown
    attributes:
      value: |
        Photos of posted signs help settle boundaries the law describes only in words. Attach the photo below. Reports are public.
  - type: input
    id: where
    attributes:
      label: Location of the sign
      description: Coordinates if possible, or a description precise enough to find it.
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What the sign says, and the photo
      description: Type the sign's wording and drag the photo into this box.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of the photo
