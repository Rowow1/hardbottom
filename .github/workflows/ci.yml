name: Checks

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Data checks (citation ids, coordinates, closed rings)
        run: python3 tools/test-data.py
      - name: JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Map text rules (no dashes, no permissive wording)
        run: python3 tools/check-text.py
      - name: Install jsdom for the smoke test
        run: npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/jsdom" jsdom@24.1.3
      - name: Smoke test, served mode
        run: NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node test/smoke-test.js
      - name: Build the offline copies
        run: python3 build-standalone.py
      - name: Smoke test, offline builds
        run: |
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node test/smoke-test.js --standalone
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node test/smoke-test.js --lite
